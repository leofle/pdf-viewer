<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PDF Viewer</title>
  <meta name="description" content="A fast, dependency-light PDF viewer that runs entirely in your browser. Built on Mozilla PDF.js.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply the saved / preferred theme before first paint to avoid a flash.
    (function () {
      var t = localStorage.getItem("pdfv-theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
      <symbol id="i-open" viewBox="0 0 24 24"><path d="M4 20h16a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1h-8l-2-3H4a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1z"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-4.3-4.3"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M21 21l-4.3-4.3"/></symbol>
      <symbol id="i-width" viewBox="0 0 24 24"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></symbol>
      <symbol id="i-page" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
      <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
      <symbol id="i-print" viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
    </defs>
  </svg>

  <header class="toolbar" role="toolbar" aria-label="Document toolbar">
    <div class="group">
      <button class="icon-btn" id="sidebarToggle" title="Toggle thumbnails" aria-label="Toggle thumbnails" aria-pressed="true"><svg><use href="#i-sidebar"/></svg></button>
      <button class="icon-btn" id="openFile" title="Open PDF (Ctrl+O)" aria-label="Open PDF"><svg><use href="#i-open"/></svg></button>
      <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
      <span class="doc-title" id="docTitle" title="">PDF Viewer</span>
    </div>

    <div class="group center">
      <button class="icon-btn" id="prevPage" title="Previous page (←)" aria-label="Previous page"><svg><use href="#i-up"/></svg></button>
      <label class="page-box">
        <input id="pageNumber" type="text" inputmode="numeric" value="1" aria-label="Page number" autocomplete="off">
        <span class="muted">/ <span id="pageCount">–</span></span>
      </label>
      <button class="icon-btn" id="nextPage" title="Next page (→)" aria-label="Next page"><svg><use href="#i-down"/></svg></button>
      <span class="divider"></span>
      <button class="icon-btn" id="zoomOut" title="Zoom out (Ctrl −)" aria-label="Zoom out"><svg><use href="#i-minus"/></svg></button>
      <select id="scaleSelect" aria-label="Zoom level" title="Zoom level">
        <option value="auto">Automatic</option>
        <option value="page-width">Fit width</option>
        <option value="page-fit">Fit page</option>
        <option value="page-actual">Actual size</option>
        <option value="custom" id="customScale" hidden></option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="3">300%</option>
        <option value="4">400%</option>
      </select>
      <button class="icon-btn" id="zoomIn" title="Zoom in (Ctrl +)" aria-label="Zoom in"><svg><use href="#i-plus"/></svg></button>
      <button class="icon-btn hide-sm" id="fitWidth" title="Fit width" aria-label="Fit width"><svg><use href="#i-width"/></svg></button>
      <button class="icon-btn hide-sm" id="fitPage" title="Fit page" aria-label="Fit page"><svg><use href="#i-page"/></svg></button>
    </div>

    <div class="group right">
      <button class="icon-btn" id="findToggle" title="Search (Ctrl+F)" aria-label="Search" aria-expanded="false"><svg><use href="#i-search"/></svg></button>
      <div class="secondary" id="secondary">
        <button class="icon-btn" id="rotate" title="Rotate clockwise (R)" aria-label="Rotate clockwise"><svg><use href="#i-rotate"/></svg><span class="menu-label">Rotate</span></button>
        <button class="icon-btn" id="download" title="Download" aria-label="Download"><svg><use href="#i-download"/></svg><span class="menu-label">Download</span></button>
        <button class="icon-btn" id="print" title="Print (Ctrl+P)" aria-label="Print"><svg><use href="#i-print"/></svg><span class="menu-label">Print</span></button>
        <button class="icon-btn" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode"><svg class="when-light"><use href="#i-moon"/></svg><svg class="when-dark"><use href="#i-sun"/></svg><span class="menu-label">Theme</span></button>
      </div>
      <button class="icon-btn show-sm" id="moreToggle" title="More" aria-label="More actions" aria-expanded="false"><svg><use href="#i-more"/></svg></button>
    </div>
  </header>

  <div class="findbar" id="findbar" hidden>
    <svg class="find-icon"><use href="#i-search"/></svg>
    <input id="findInput" type="search" placeholder="Find in document…" aria-label="Find in document" autocomplete="off">
    <span class="find-count muted" id="findCount" aria-live="polite"></span>
    <button class="icon-btn" id="findPrev" title="Previous match (Shift+Enter)" aria-label="Previous match"><svg><use href="#i-up"/></svg></button>
    <button class="icon-btn" id="findNext" title="Next match (Enter)" aria-label="Next match"><svg><use href="#i-down"/></svg></button>
    <label class="check"><input type="checkbox" id="findCase"> Aa</label>
    <label class="check"><input type="checkbox" id="findWord"> Whole word</label>
    <button class="icon-btn" id="findClose" title="Close (Esc)" aria-label="Close search"><svg><use href="#i-close"/></svg></button>
  </div>

  <main class="main">
    <aside class="sidebar" id="sidebar" aria-label="Page thumbnails">
      <div class="thumbs" id="thumbs"></div>
    </aside>
    <div class="viewer-wrap">
      <div id="viewerContainer" tabindex="0" aria-label="Document">
        <div id="viewer" class="pdfViewer"></div>
      </div>
      <div class="empty" id="emptyState" hidden>
        <div class="empty-card">
          <svg><use href="#i-open"/></svg>
          <h2>Open a PDF</h2>
          <p>Drop a file anywhere, or <button class="link" id="emptyOpen">browse your device</button>.</p>
          <p class="muted small">Everything stays in your browser — nothing is uploaded.</p>
        </div>
      </div>
      <div class="loading" id="loading" hidden><div class="spinner"></div><span id="loadingText">Loading…</span></div>
    </div>
  </main>

  <div class="dropzone" id="dropzone" hidden><div>Drop PDF to open</div></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div id="printContainer" aria-hidden="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
